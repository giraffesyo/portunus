version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nolintlint
    - prealloc
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    gosec:
      excludes:
        # Integer conversions here are sizes bounded by the protocol (a
        # 24-bit frame length) or by validated config; where a bound was
        # missing it was added (MaxBatchBytes) rather than suppressed.
        - G115
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1008"]
  exclusions:
    rules:
      # Tests ignore errors from cleanup and from helper goroutines whose
      # failures surface as a mismatch the test checks anyway.
      - path: _test\.go
        linters: [errcheck, gosec, prealloc]
      # Go doc examples use log.Fatal by convention.
      - path: example_test\.go
        text: exitAfterDefer
      # The benchmark harness is not shipped; pprof is deliberate.
      - path: bench/
        linters: [errcheck, gosec]

formatters:
  enable:
    - gofmt
