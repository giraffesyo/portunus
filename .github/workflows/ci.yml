name: CI

on:
  push:
    branches: [main, canary]
  pull_request:

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not decoration: net.Buffers only becomes writev on a
        # concrete *net.TCPConn, which package net does not provide there, so
        # every Windows write takes the coalesce path. Cross-compiling proved
        # it builds; only running the suite proves it works.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Verify the core has no dependencies
        if: runner.os != 'Windows'
        run: |
          # A zero-dependency core is only real if it is enforced. The module
          # graph must contain nothing but the main module itself.
          modules=$(go list -m all)
          if [ "$(echo "$modules" | wc -l)" -ne 1 ]; then
            echo "the core module gained a dependency:"; echo "$modules"; exit 1
          fi

      - run: go vet ./...
      - run: go test -race -count=1 ./...

      - name: Cross-compile
        # Shell-dependent, so kept off Windows; the other two runners cover it.
        if: runner.os != 'Windows'
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
          done

      - name: Wire-format fuzzing
        if: runner.os != 'Windows'
        run: go test ./internal/frame -fuzz=FuzzParseHeader -fuzztime=30s

  quic-adapter:
    name: QUIC adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Conformance suite over QUIC
        working-directory: adapters/quic
        run: go test -race -count=1 ./...

  quic-latest:
    name: QUIC adapter vs quic-go@latest
    runs-on: ubuntu-latest
    # quic-go is pre-1.0 and breaks its API every few releases; this catches
    # that within a day instead of at the next integration.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build and test against the newest quic-go
        working-directory: adapters/quic
        run: |
          go get github.com/quic-go/quic-go@latest
          go build ./... && go test -count=1 ./...

  fuzz:
    name: Protocol fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Wire format
        run: go test -run XXX -fuzz=FuzzParseHeader -fuzztime=60s ./internal/frame

      - name: Stream payloads
        run: go test -run XXX -fuzz=FuzzStreamPayloads -fuzztime=60s .

      - name: Protocol state model
        # The model checker earns its keep: it asserts delivery, session
        # survival, credit accounting, and liveness across randomized
        # interleavings, which is the class of defect input fuzzing cannot
        # reach and where this package's worst bugs have actually been.
        #
        # Concurrency is capped because every execution builds two real
        # sessions with their goroutines and buffers. At one worker per core
        # the fuzzing process dies of its own weight and reports "hung or
        # terminated" instead of whatever it found.
        run: go test -run XXX -fuzz=FuzzProtocolModel -fuzztime=180s -parallel=4 .

      - name: Report any crashers
        if: failure()
        run: |
          echo "::group::failing inputs"
          find . -path '*/testdata/fuzz/*' -type f -print -exec cat {} \;
          echo "::endgroup::"

  leak-profile:
    name: Goroutine leak profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Soak and leak detection
        # The runtime's own detector proves a goroutine is permanently
        # blocked, which counting stacks by hand cannot.
        env:
          GOEXPERIMENT: goroutineleakprofile
        run: go test -count=1 -run 'TestSoak|TestGoroutineLeakProfile|TestNoGoroutineLeak' ./...

  bench:
    name: Benchmarks vs yamux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Smoke-run the comparison suite
        working-directory: bench
        run: go test -bench=. -benchtime=10x -run XXX ./...

  netem:
    name: WAN profile (netem-shaped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Shape loopback (200ms RTT, 100mbit)
        # The in-process delay harness has no bandwidth limit, so its numbers
        # are dominated by chunk granularity rather than the protocol. This
        # is the gate the WAN autotuning claim actually rests on.
        run: sudo tc qdisc add dev lo root netem delay 100ms rate 100mbit

      - name: Autotuning vs a static window on a long path
        working-directory: bench
        env:
          MUX_NETEM: '1'
        run: go test -bench=Netem -benchtime=5x -timeout 20m -run XXX ./...

      - name: Unshape
        if: always()
        run: sudo tc qdisc del dev lo root || true
