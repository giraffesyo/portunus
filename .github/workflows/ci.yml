name: CI

on:
  push:
    branches: [main, canary]
  pull_request:

# Nothing here writes to the repository, so the token cannot either. A job
# that needs more must ask for it by name.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are noise; branch pushes each run to the end
  # so every commit on canary has a verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows is not decoration: net.Buffers only becomes writev on a
        # concrete *net.TCPConn, which package net does not provide there, so
        # every Windows write takes the coalesce path. Cross-compiling proved
        # it builds; only running the suite proves it works.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'

      - name: Verify the core has no dependencies
        if: runner.os != 'Windows'
        run: |
          # A zero-dependency core is only real if it is enforced. The module
          # graph must contain nothing but the main module itself.
          modules=$(go list -m all)
          if [ "$(echo "$modules" | wc -l)" -ne 1 ]; then
            echo "the core module gained a dependency:"; echo "$modules"; exit 1
          fi

      - run: go vet ./...
      - run: go test -race -count=1 ./...

      - name: Cross-compile
        # Shell-dependent, so kept off Windows; the other two runners cover it.
        if: runner.os != 'Windows'
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
          done

      - name: Wire-format fuzzing
        if: runner.os != 'Windows'
        run: go test ./internal/frame -fuzz=FuzzParseHeader -fuzztime=30s

  quic-adapter:
    name: QUIC adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Conformance suite over QUIC
        working-directory: adapters/quic
        run: go test -race -count=1 ./...

  quic-latest:
    name: QUIC adapter vs quic-go@latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # quic-go is pre-1.0 and breaks its API every few releases; this catches
    # that within a day instead of at the next integration.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Build and test against the newest quic-go
        working-directory: adapters/quic
        run: |
          go get github.com/quic-go/quic-go@latest
          go build ./... && go test -count=1 ./...

  fuzz:
    name: Protocol fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'

      - name: Wire format
        run: go test -run XXX -fuzz=FuzzParseHeader -fuzztime=60s ./internal/frame

      - name: Stream payloads
        run: go test -run XXX -fuzz=FuzzStreamPayloads -fuzztime=60s .

      - name: Protocol state model
        # The model checker earns its keep: it asserts delivery, session
        # survival, credit accounting, and liveness across randomized
        # interleavings, which is the class of defect input fuzzing cannot
        # reach and where this package's worst bugs have actually been.
        #
        # Concurrency is capped because every execution builds two real
        # sessions with their goroutines and buffers. At one worker per core
        # the fuzzing process dies of its own weight and reports "hung or
        # terminated" instead of whatever it found.
        run: go test -run XXX -fuzz=FuzzProtocolModel -fuzztime=180s -parallel=4 .

      - name: Report any crashers
        if: failure()
        run: |
          echo "::group::failing inputs"
          find . -path '*/testdata/fuzz/*' -type f -print -exec cat {} \;
          echo "::endgroup::"

  leak-profile:
    name: Goroutine leak profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Soak and leak detection
        # The runtime's own detector proves a goroutine is permanently
        # blocked, which counting stacks by hand cannot.
        env:
          GOEXPERIMENT: goroutineleakprofile
        run: go test -count=1 -run 'TestSoak|TestGoroutineLeakProfile|TestNoGoroutineLeak' ./...

  bench:
    name: Benchmarks vs yamux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Smoke-run the comparison suite
        working-directory: bench
        run: go test -bench=. -benchtime=10x -run XXX ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Three modules: the dependency-free core and the two satellites
        # that keep their dependencies out of it.
        module: [., bench, adapters/quic]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # Tools run by exact version through the module proxy, so they are
      # pinned and checksum-verified like any other dependency.
      - name: golangci-lint (linters and gofmt)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -test ./...

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: zizmor (workflow security audit)
        run: pipx run zizmor==1.30.1 --offline .

  bench-regression:
    name: Benchmark regression gate
    # A comparison only means something on one machine, so it runs where
    # there is a base to compare against: a pull request's target.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: head/bench/go.sum
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Compare base and head, interleaved on this runner
        # The script comes from head, so a pull request that changes the gate
        # is judged by the gate it proposes; it is a regression check, not a
        # security boundary.
        run: head/bench/regress.sh base head

  race-stress:
    name: Race stress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Concurrency-sensitive tests, repeated
        # Several send-path bugs only ever showed under repetition with
        # other tests competing for the cores: an ordering slip at a batch
        # swap, a lost admission wake, a shutdown reset. One pass of the
        # suite runs each of these once; this runs them enough to catch a
        # one-in-a-few-hundred interleaving.
        run: >-
          go test -race -count=25
          -run 'Admission|MultiFrame|SmallFrameShard|MixedLane|NeverStranded|WriteBuffers|Close|Relay|Shutdown|Priority'
          .

  netem:
    name: WAN profile (netem-shaped)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'

      - name: Shape loopback (200ms RTT, 100mbit)
        # The in-process delay harness has no bandwidth limit, so its numbers
        # are dominated by chunk granularity rather than the protocol. This
        # is the gate the WAN autotuning claim actually rests on.
        run: sudo tc qdisc add dev lo root netem delay 100ms rate 100mbit

      - name: Autotuning vs a static window on a long path
        working-directory: bench
        env:
          MUX_NETEM: '1'
        run: go test -bench=Netem -benchtime=5x -timeout 20m -run XXX ./...

      - name: Unshape
        if: always()
        run: sudo tc qdisc del dev lo root || true
